name: BATMAN PAPER TRADE

on:
  schedule:
    - cron: "*/5 4-10 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "scan"
        type: choice
        options: [scan, mark, site]
      underlying:
        description: "Instrument"
        required: true
        default: "BOTH"
        type: choice
        options: [BOTH, NIFTY, SENSEX]
      force_today:
        description: "Allow scan outside D3 for a deliberate manual diagnostic"
        required: true
        default: false
        type: boolean

concurrency:
  group: batman-paper-trade-data
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  paper_trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-prospective.txt
      - name: Run scan / mark / site
        env:
          BSE_OPTION_CHAIN_URL: ${{ secrets.BSE_OPTION_CHAIN_URL }}
          PAYTM_MONEY_JWT_TOKEN: ${{ secrets.PAYTM_MONEY_JWT_TOKEN }}
        run: |
          MODE="${{ inputs.mode || 'scan' }}"
          UNDERLYING="${{ inputs.underlying || 'BOTH' }}"
          FORCE="${{ inputs.force_today || 'false' }}"
          if [ "$MODE" = "scan" ]; then
            if [ "$FORCE" = "true" ]; then
              python -m src.prospective_validation.cli scan --underlying "$UNDERLYING" --force-today
            else
              python -m src.prospective_validation.cli scan --underlying "$UNDERLYING"
            fi
          elif [ "$MODE" = "mark" ]; then
            python -m src.prospective_validation.cli mark --underlying "$UNDERLYING"
          else
            python -m src.prospective_validation.cli site
          fi
          python -m src.prospective_validation.cli site
      - name: Run tests
        run: python -m pytest -q tests/test_prospective_validation.py
      - name: Commit prospective records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper site
          if git diff --cached --quiet; then
            echo "No prospective data changes."
          else
            git commit -m "Prospective BATMAN: update paper-trade records"
            git push
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
