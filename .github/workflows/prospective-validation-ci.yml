name: Prospective Validation CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-prospective.txt
      - name: Compile
        run: python -m compileall src tests
      - name: Import engine and build dashboard
        run: python -c "from src.prospective_validation.engine import scan, mark; from src.prospective_validation.site import build; build(); print('engine/site imports: PASS')"
      - name: Prospective smoke test
        run: python tests/smoke_prospective.py
