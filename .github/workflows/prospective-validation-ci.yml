name: Prospective Validation CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-prospective.txt
      - name: Compile
        run: python -m compileall src tests
      - name: Unit tests
        run: pytest -q tests/test_prospective_validation.py
