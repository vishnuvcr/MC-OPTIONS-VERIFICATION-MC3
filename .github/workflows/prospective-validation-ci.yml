name: Prospective Validation CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-prospective.txt
      - run: python -m compileall src tests
      - run: pytest -q tests/test_prospective_validation.py
