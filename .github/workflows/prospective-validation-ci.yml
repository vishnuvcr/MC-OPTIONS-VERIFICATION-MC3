name: Prospective Validation CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-prospective.txt
      - run: python -m compileall src tests
      - run: pytest -q tests/test_prospective_validation.py
      - name: Parse workflow YAML
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |f| YAML.load_file(f); puts "YAML OK: #{f}" }'
