name: Phase 3 - RQ6 Baseline Revalidation

on:
  workflow_dispatch:

jobs:
  phase3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas pytest
      - run: pytest -q tests/test_rq6_control.py
